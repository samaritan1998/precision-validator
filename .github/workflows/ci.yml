name: Python package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installed-wheel:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install build numpy
      - run: python -m build
      - name: Test actual installation without training dependencies
        run: >-
          python scripts/verify_wheel.py
          --wheel dist/precision_validator-0.3.0rc2-py3-none-any.whl
          --tests tests --evidence test-results/core
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-${{ matrix.python-version }}
          path: test-results/
  torch-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build numpy
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m build
      - run: >-
          python scripts/verify_wheel.py
          --wheel dist/precision_validator-0.3.0rc2-py3-none-any.whl
          --tests tests --evidence test-results/torch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: torch-cpu
          path: test-results/
